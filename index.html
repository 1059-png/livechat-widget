<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Info Widget</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #ffffff;
            overflow-x: hidden;
        }
        #root {
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@livechat/agent-app-sdk@2.3.3/dist/agentapp.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const AccountWidget = () => {
            const [customerData, setCustomerData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [rawData, setRawData] = useState(null);
            const [debugInfo, setDebugInfo] = useState([]);

            const addDebug = (msg) => {
                console.log(msg);
                setDebugInfo(prev => [...prev, `${new Date().toLocaleTimeString()}: ${msg}`]);
            };

            useEffect(() => {
                const initializeSDK = async () => {
                    try {
                        addDebug('Starting SDK initialization...');
                        addDebug(`window.LiveChatAgentSDK exists: ${!!window.LiveChatAgentSDK}`);
                        addDebug(`window.LiveChatWidget exists: ${!!window.LiveChatWidget}`);
                        
                        // Wait for SDK to be available
                        let attempts = 0;
                        while (!window.LiveChatAgentSDK && attempts < 50) {
                            await new Promise(resolve => setTimeout(resolve, 100));
                            attempts++;
                            if (attempts % 10 === 0) {
                                addDebug(`Waiting for SDK... attempt ${attempts}`);
                            }
                        }

                        if (!window.LiveChatAgentSDK) {
                            throw new Error('LiveChat SDK not found after 5 seconds');
                        }

                        addDebug('SDK found, initializing...');
                        const sdk = await window.LiveChatAgentSDK.init();
                        addDebug('SDK initialized successfully');

                        // Listen for customer profile updates
                        sdk.on('customer_profile', (profile) => {
                            addDebug('Customer profile event received');
                            processCustomerData(profile);
                        });

                        // Get initial customer profile
                        addDebug('Requesting customer profile...');
                        const profile = await sdk.getCustomerProfile();
                        addDebug('Customer profile received');
                        processCustomerData(profile);

                    } catch (err) {
                        addDebug(`Error: ${err.message}`);
                        setError(err.message);
                        setLoading(false);
                    }
                };

                const processCustomerData = (profile) => {
                    addDebug('Processing customer data...');
                    setRawData(profile);

                    if (!profile) {
                        addDebug('No profile data');
                        setCustomerData({});
                        setLoading(false);
                        return;
                    }

                    // Extract integration data - try multiple possible locations
                    let integrationData = {};

                    // Check different possible locations
                    if (profile.fields) {
                        addDebug(`Found ${Object.keys(profile.fields).length} fields`);
                        integrationData = { ...profile.fields };
                    }

                    if (profile.properties) {
                        addDebug(`Found ${Object.keys(profile.properties).length} properties`);
                        integrationData = { ...integrationData, ...profile.properties };
                    }

                    if (profile.customer_fields) {
                        addDebug(`Found ${Object.keys(profile.customer_fields).length} customer_fields`);
                        integrationData = { ...integrationData, ...profile.customer_fields };
                    }

                    addDebug(`Total integration fields: ${Object.keys(integrationData).length}`);

                    // Map the fields we care about - check both with and without default_ prefix
                    const mappedData = {
                        default_name: integrationData.default_name || integrationData.name || profile.name || 'Unknown Customer',
                        Pending_WD: integrationData.Pending_WD || integrationData.default_Pending_WD || 'N/A',
                        KYC: integrationData.KYC || integrationData.default_KYC || 'N/A',
                        VIP_Binary: integrationData.VIP_Binary || integrationData.default_VIP_Binary || 'N/A',
                        Player_Class: integrationData.Player_Class || integrationData.default_Player_Class || 'N/A',
                        Bonus_offer: integrationData.Bonus_offer || integrationData.default_Bonus_offer || 'N/A',
                        Bonus_active: integrationData.Bonus_active || integrationData.default_Bonus_active || 'N/A',
                        Withdraw_limit_day: integrationData.Withdraw_limit_day || integrationData.default_Withdraw_limit_day || 'N/A',
                        Withdraw_limit_week: integrationData.Withdraw_limit_week || integrationData.default_Withdraw_limit_week || 'N/A',
                        Withdraw_limit_month: integrationData.Withdraw_limit_month || integrationData.default_Withdraw_limit_month || 'N/A'
                    };

                    addDebug('Data mapped successfully');
                    setCustomerData(mappedData);
                    setLoading(false);
                };

                initializeSDK();
            }, []);

            const formatFieldName = (key) => {
                return key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            };

            const getStatusColor = (value) => {
                const valueStr = String(value).toUpperCase();
                if (valueStr === "TRUE") return "color: #16a34a; background-color: #f0fdf4; padding: 4px 8px; border-radius: 4px; display: inline-block; font-weight: 600;";
                if (valueStr === "FALSE") return "color: #4b5563; background-color: #f9fafb; padding: 4px 8px; border-radius: 4px; display: inline-block; font-weight: 600;";
                if (valueStr.includes("VIP") || valueStr === "PVIP") return "color: #9333ea; background-color: #faf5ff; padding: 4px 8px; border-radius: 4px; display: inline-block; font-weight: 600;";
                if (valueStr === "N/A") return "color: #9ca3af; background-color: #f3f4f6; padding: 4px 8px; border-radius: 4px; display: inline-block; font-style: italic;";
                return "color: #2563eb; background-color: #eff6ff; padding: 4px 8px; border-radius: 4px; display: inline-block; font-weight: 600;";
            };

            if (loading) {
                return (
                    <div style={{padding: '24px'}}>
                        <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '200px', backgroundColor: '#f9fafb', borderRadius: '8px'}}>
                            <div style={{textAlign: 'center'}}>
                                <div style={{
                                    border: '3px solid #f3f4f6',
                                    borderTop: '3px solid #2563eb',
                                    borderRadius: '50%',
                                    width: '48px',
                                    height: '48px',
                                    animation: 'spin 1s linear infinite',
                                    margin: '0 auto 16px'
                                }}></div>
                                <p style={{color: '#6b7280', fontSize: '14px'}}>Loading customer data...</p>
                                {debugInfo.length > 0 && (
                                    <details style={{marginTop: '12px', textAlign: 'left'}}>
                                        <summary style={{cursor: 'pointer', fontSize: '11px', color: '#9ca3af'}}>Loading details</summary>
                                        <div style={{marginTop: '8px', padding: '8px', backgroundColor: '#ffffff', borderRadius: '4px', fontSize: '10px', maxHeight: '150px', overflow: 'auto'}}>
                                            {debugInfo.map((msg, i) => <div key={i}>{msg}</div>)}
                                        </div>
                                    </details>
                                )}
                            </div>
                            <style>{`@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }}`}</style>
                        </div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div style={{padding: '24px'}}>
                        <div style={{backgroundColor: '#fef2f2', border: '1px solid #fecaca', borderRadius: '8px', padding: '16px'}}>
                            <div style={{display: 'flex', alignItems: 'flex-start'}}>
                                <div style={{marginRight: '12px', color: '#dc2626', fontSize: '20px'}}>⚠</div>
                                <div style={{flex: 1}}>
                                    <h3 style={{color: '#991b1b', fontWeight: '600', marginBottom: '4px', fontSize: '14px'}}>Error Loading Data</h3>
                                    <p style={{color: '#dc2626', fontSize: '12px', marginBottom: '8px'}}>{error}</p>
                                    <details>
                                        <summary style={{cursor: 'pointer', fontSize: '11px', color: '#7f1d1d', marginBottom: '8px'}}>Debug Log</summary>
                                        <div style={{padding: '8px', backgroundColor: '#ffffff', borderRadius: '4px', fontSize: '10px', maxHeight: '200px', overflow: 'auto'}}>
                                            {debugInfo.map((msg, i) => <div key={i} style={{marginBottom: '2px'}}>{msg}</div>)}
                                        </div>
                                    </details>
                                    {rawData && (
                                        <details style={{marginTop: '8px'}}>
                                            <summary style={{cursor: 'pointer', fontSize: '11px', color: '#7f1d1d'}}>Raw Data</summary>
                                            <pre style={{fontSize: '10px', marginTop: '4px', overflow: 'auto', maxHeight: '200px', padding: '8px', backgroundColor: '#ffffff', borderRadius: '4px'}}>
                                                {JSON.stringify(rawData, null, 2)}
                                            </pre>
                                        </details>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (!customerData || Object.keys(customerData).filter(k => customerData[k] !== 'N/A' && customerData[k] !== 'Unknown Customer').length === 0) {
                return (
                    <div style={{padding: '24px'}}>
                        <div style={{backgroundColor: '#fffbeb', border: '1px solid #fde68a', borderRadius: '8px', padding: '16px'}}>
                            <div style={{display: 'flex', alignItems: 'flex-start'}}>
                                <div style={{marginRight: '12px', color: '#d97706', fontSize: '20px'}}>ℹ</div>
                                <div style={{flex: 1}}>
                                    <h3 style={{color: '#92400e', fontWeight: '600', marginBottom: '4px', fontSize: '14px'}}>No Data Available</h3>
                                    <p style={{color: '#d97706', fontSize: '12px', marginBottom: '8px'}}>No customer account information found for this chat.</p>
                                    <details>
                                        <summary style={{cursor: 'pointer', fontSize: '11px', color: '#78350f'}}>Debug Info</summary>
                                        <pre style={{fontSize: '10px', marginTop: '4px', overflow: 'auto', maxHeight: '200px', padding: '8px', backgroundColor: '#ffffff', borderRadius: '4px'}}>
                                            {JSON.stringify(rawData, null, 2)}
                                        </pre>
                                    </details>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div style={{backgroundColor: '#ffffff', minHeight: '100vh'}}>
                    {/* Header */}
                    <div style={{
                        background: 'linear-gradient(to right, #2563eb, #1d4ed8)',
                        color: 'white',
                        padding: '16px',
                        position: 'sticky',
                        top: 0,
                        zIndex: 10,
                        boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1)'
                    }}>
                        <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                            <span style={{fontSize: '20px'}}>👤</span>
                            <h2 style={{fontSize: '18px', fontWeight: '600'}}>Account Information</h2>
                        </div>
                    </div>

                    {/* Customer Name Card */}
                    {customerData.default_name && customerData.default_name !== 'Unknown Customer' && (
                        <div style={{
                            margin: '16px',
                            padding: '16px',
                            background: 'linear-gradient(to right, #eff6ff, #dbeafe)',
                            borderRadius: '8px',
                            border: '1px solid #bfdbfe'
                        }}>
                            <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
                                <div style={{
                                    width: '48px',
                                    height: '48px',
                                    backgroundColor: '#2563eb',
                                    borderRadius: '50%',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    color: 'white',
                                    fontWeight: 'bold',
                                    fontSize: '18px'
                                }}>
                                    {customerData.default_name.charAt(0)}
                                </div>
                                <div>
                                    <p style={{fontSize: '11px', color: '#6b7280', textTransform: 'uppercase', letterSpacing: '0.05em'}}>Customer</p>
                                    <p style={{fontSize: '18px', fontWeight: 'bold', color: '#1f2937'}}>{customerData.default_name}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Account Details */}
                    <div style={{padding: '0 16px 16px', display: 'flex', flexDirection: 'column', gap: '12px'}}>
                        {Object.entries(customerData).map(([key, value]) => {
                            if (key === 'default_name') return null;
                            
                            return (
                                <div key={key} style={{
                                    backgroundColor: 'white',
                                    border: '1px solid #e5e7eb',
                                    borderRadius: '8px',
                                    padding: '14px',
                                    transition: 'box-shadow 0.2s'
                                }}
                                onMouseEnter={(e) => e.currentTarget.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)'}
                                onMouseLeave={(e) => e.currentTarget.style.boxShadow = 'none'}>
                                    <p style={{
                                        fontSize: '11px',
                                        fontWeight: '500',
                                        color: '#6b7280',
                                        textTransform: 'uppercase',
                                        letterSpacing: '0.05em',
                                        marginBottom: '6px'
                                    }}>
                                        {formatFieldName(key)}
                                    </p>
                                    <div style={{fontSize: '13px'}}>
                                        <span style={getStatusColor(value)}>{value}</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Status Summary */}
                    <div style={{
                        margin: '16px',
                        padding: '16px',
                        backgroundColor: '#f9fafb',
                        borderRadius: '8px',
                        border: '1px solid #e5e7eb'
                    }}>
                        <h3 style={{fontSize: '14px', fontWeight: '600', color: '#374151', marginBottom: '12px'}}>Quick Status</h3>
                        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px'}}>
                            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                <div style={{
                                    width: '8px',
                                    height: '8px',
                                    borderRadius: '50%',
                                    backgroundColor: String(customerData.KYC).toUpperCase() === 'TRUE' ? '#22c55e' : '#d1d5db'
                                }}></div>
                                <span style={{fontSize: '12px', color: '#6b7280'}}>KYC Verified</span>
                            </div>
                            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                <div style={{
                                    width: '8px',
                                    height: '8px',
                                    borderRadius: '50%',
                                    backgroundColor: String(customerData.VIP_Binary).toUpperCase() === 'TRUE' ? '#a855f7' : '#d1d5db'
                                }}></div>
                                <span style={{fontSize: '12px', color: '#6b7280'}}>VIP Status</span>
                            </div>
                            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                <div style={{
                                    width: '8px',
                                    height: '8px',
                                    borderRadius: '50%',
                                    backgroundColor: String(customerData.Pending_WD).toUpperCase() === 'TRUE' ? '#eab308' : '#d1d5db'
                                }}></div>
                                <span style={{fontSize: '12px', color: '#6b7280'}}>Pending Withdrawal</span>
                            </div>
                            <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                <div style={{
                                    width: '8px',
                                    height: '8px',
                                    borderRadius: '50%',
                                    backgroundColor: String(customerData.Bonus_active).toUpperCase() === 'TRUE' ? '#3b82f6' : '#d1d5db'
                                }}></div>
                                <span style={{fontSize: '12px', color: '#6b7280'}}>Active Bonus</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<AccountWidget />, document.getElementById('root'));
    </script>
</body>
</html>
