<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Info Widget</title>
    <script src="https://unpkg.com/@livechat/agent-app-sdk@2.3.3/dist/agentapp.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #ffffff;
            overflow-x: hidden;
        }
        #root {
            width: 100%;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(to right, #2563eb, #1d4ed8);
            color: white;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .customer-card {
            margin: 16px;
            padding: 16px;
            background: linear-gradient(to right, #eff6ff, #dbeafe);
            border-radius: 8px;
            border: 1px solid #bfdbfe;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 48px;
            height: 48px;
            background-color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justif-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .field-card {
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 14px;
            transition: box-shadow 0.2s;
        }
        .field-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .field-label {
            font-size: 11px;
            font-weight: 500;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .field-value {
            font-size: 13px;
        }
        .status-true {
            color: #16a34a;
            background-color: #f0fdf4;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 600;
        }
        .status-false {
            color: #4b5563;
            background-color: #f9fafb;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 600;
        }
        .status-vip {
            color: #9333ea;
            background-color: #faf5ff;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 600;
        }
        .status-default {
            color: #2563eb;
            background-color: #eff6ff;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 600;
        }
        .quick-status {
            margin: 16px;
            padding: 16px;
            background-color: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .loading-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            background-color: #f9fafb;
            border-radius: 8px;
            margin: 24px;
        }
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-box {
            margin: 24px;
            padding: 16px;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
        }
        .debug-section {
            margin: 16px;
            padding: 12px;
            background-color: #f3f4f6;
            border-radius: 4px;
            font-size: 10px;
            max-height: 200px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-container">
            <div style="text-align: center;">
                <div class="spinner"></div>
                <p style="color: #6b7280; font-size: 14px;">Initializing widget...</p>
            </div>
        </div>
    </div>

    <script>
        let customerData = null;
        let debugLogs = [];
        let sdk = null;

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `${timestamp}: ${message}`;
            debugLogs.push(logMessage);
            console.log(logMessage);
        }

        function formatFieldName(key) {
            return key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function getStatusClass(value) {
            const valueStr = String(value).toUpperCase();
            if (valueStr === "TRUE") return "status-true";
            if (valueStr === "FALSE") return "status-false";
            if (valueStr.includes("VIP") || valueStr === "PVIP") return "status-vip";
            return "status-default";
        }

        function showError(message) {
            const root = document.getElementById('root');
            root.innerHTML = `
                <div class="error-box">
                    <h3 style="color: #991b1b; font-weight: 600; font-size: 14px; margin-bottom: 8px;">Error</h3>
                    <p style="color: #dc2626; font-size: 12px; margin-bottom: 12px;">${message}</p>
                    <details>
                        <summary style="cursor: pointer; font-size: 11px; color: #7f1d1d;">View Debug Log</summary>
                        <div class="debug-section">
                            ${debugLogs.map(log => `<div>${log}</div>`).join('')}
                        </div>
                    </details>
                </div>
            `;
        }

        function renderWidget() {
            const root = document.getElementById('root');
            
            if (!customerData) {
                showError('No customer data available');
                return;
            }

            let html = `
                <div class="header">
                    <span style="font-size: 20px;">👤</span>
                    <h2 style="font-size: 18px; font-weight: 600;">Account Information</h2>
                </div>
            `;

            if (customerData.default_name && customerData.default_name !== 'Unknown') {
                html += `
                    <div class="customer-card">
                        <div class="avatar">${customerData.default_name.charAt(0)}</div>
                        <div>
                            <p style="font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em;">Customer</p>
                            <p style="font-size: 18px; font-weight: bold; color: #1f2937;">${customerData.default_name}</p>
                        </div>
                    </div>
                `;
            }

            html += '<div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px;">';
            
            Object.entries(customerData).forEach(([key, value]) => {
                if (key === 'default_name') return;
                
                html += `
                    <div class="field-card">
                        <div class="field-label">${formatFieldName(key)}</div>
                        <div class="field-value">
                            <span class="${getStatusClass(value)}">${value}</span>
                        </div>
                    </div>
                `;
            });

            html += '</div>';

            html += `
                <div class="quick-status">
                    <h3 style="font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 12px;">Quick Status</h3>
                    <div class="status-grid">
                        <div class="status-item">
                            <div class="status-dot" style="background-color: ${String(customerData.KYC).toUpperCase() === 'TRUE' ? '#22c55e' : '#d1d5db'};"></div>
                            <span style="font-size: 12px; color: #6b7280;">KYC Verified</span>
                        </div>
                        <div class="status-item">
                            <div class="status-dot" style="background-color: ${String(customerData.VIP_Binary).toUpperCase() === 'TRUE' ? '#a855f7' : '#d1d5db'};"></div>
                            <span style="font-size: 12px; color: #6b7280;">VIP Status</span>
                        </div>
                        <div class="status-item">
                            <div class="status-dot" style="background-color: ${String(customerData.Pending_WD).toUpperCase() === 'TRUE' ? '#eab308' : '#d1d5db'};"></div>
                            <span style="font-size: 12px; color: #6b7280;">Pending Withdrawal</span>
                        </div>
                        <div class="status-item">
                            <div class="status-dot" style="background-color: ${String(customerData.Bonus_active).toUpperCase() === 'TRUE' ? '#3b82f6' : '#d1d5db'};"></div>
                            <span style="font-size: 12px; color: #6b7280;">Active Bonus</span>
                        </div>
                    </div>
                </div>
                <details style="margin: 16px;">
                    <summary style="cursor: pointer; font-size: 11px; color: #6b7280; padding: 8px; background: #f3f4f6; border-radius: 4px;">Debug Log</summary>
                    <div class="debug-section">
                        ${debugLogs.map(logMsg => `<div>${logMsg}</div>`).join('')}
                    </div>
                </details>
            `;

            root.innerHTML = html;
        }

        function extractCustomerData(customer) {
            log('Extracting customer data...');
            log(`Customer object keys: ${Object.keys(customer).join(', ')}`);
            
            // Try different possible locations for the data
            let fields = {};
            
            if (customer.fields) {
                log(`Found ${Object.keys(customer.fields).length} fields`);
                fields = customer.fields;
            } else if (customer.properties) {
                log(`Found ${Object.keys(customer.properties).length} properties`);
                fields = customer.properties;
            } else {
                log('No fields or properties found, using customer object directly');
                fields = customer;
            }

            log(`Available field keys: ${Object.keys(fields).join(', ')}`);

            return {
                default_name: fields.default_name || fields.name || customer.name || 'Unknown',
                Pending_WD: fields.Pending_WD || fields.default_Pending_WD || fields['default_Pending_WD'] || 'N/A',
                KYC: fields.KYC || fields.default_KYC || fields['default_KYC'] || 'N/A',
                VIP_Binary: fields.VIP_Binary || fields.default_VIP_Binary || fields['default_VIP_Binary'] || 'N/A',
                Player_Class: fields.Player_Class || fields.default_Player_Class || fields['default_Player_Class'] || 'N/A',
                Bonus_offer: fields.Bonus_offer || fields.default_Bonus_offer || fields['default_Bonus_offer'] || 'N/A',
                Bonus_active: fields.Bonus_active || fields.default_Bonus_active || fields['default_Bonus_active'] || 'N/A',
                Withdraw_limit_day: fields.Withdraw_limit_day || fields.default_Withdraw_limit_day || fields['default_Withdraw_limit_day'] || 'N/A',
                Withdraw_limit_week: fields.Withdraw_limit_week || fields.default_Withdraw_limit_week || fields['default_Withdraw_limit_week'] || 'N/A',
                Withdraw_limit_month: fields.Withdraw_limit_month || fields.default_Withdraw_limit_month || fields['default_Withdraw_limit_month'] || 'N/A'
            };
        }

        async function initialize() {
            try {
                log('Starting initialization...');
                log(`LiveChatAgentSDK available: ${!!window.LiveChatAgentSDK}`);

                if (!window.LiveChatAgentSDK) {
                    throw new Error('LiveChat Agent SDK not found');
                }

                log('Initializing SDK...');
                sdk = await window.LiveChatAgentSDK.init();
                log('SDK initialized successfully');

                // Listen for customer profile changes
                sdk.on('customer_profile', (customer) => {
                    log('Customer profile event received');
                    log(`Customer data: ${JSON.stringify(customer).substring(0, 200)}...`);
                    customerData = extractCustomerData(customer);
                    renderWidget();
                });

                // Get initial customer profile
                log('Fetching initial customer profile...');
                const customer = await sdk.getCustomerProfile();
                log('Customer profile received');
                log(`Customer ID: ${customer?.id || 'N/A'}`);
                log(`Customer name: ${customer?.name || 'N/A'}`);
                
                customerData = extractCustomerData(customer);
                renderWidget();

            } catch (error) {
                log(`Error: ${error.message}`);
                log(`Error stack: ${error.stack}`);
                showError(`Failed to initialize: ${error.message}`);
            }
        }

        // Wait for DOM and SDK to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
    </script>
</body>
</html>
